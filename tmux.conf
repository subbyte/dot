# terminal identifier for coloring
set -g default-terminal "xterm-256color"
set -g extended-keys on
set -g extended-keys-format csi-u

# use C-b instead of C-a
unbind C-b
set -g prefix C-a
# send C-a to other process by pressing it twice
bind C-a send-prefix

# vi binding in copy mode
setw -g mode-keys vi

# vi binding in pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# mouse scrolling
set -g mouse on

# session name in bash/zsh prompt
set -g status off
